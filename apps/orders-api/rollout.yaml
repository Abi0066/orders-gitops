apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders-api
  namespace: orders
  labels:
    app: orders-api
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
      annotations:
        # Consumed by the prometheus-server chart's kubernetes-pods job, which
        # labelmaps pod labels -- that is how rollouts_pod_template_hash ends up
        # in Prometheus and how the AnalysisTemplate can isolate the canary.
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-api
          image: ghcr.io/abi0066/orders-api:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_VERSION
              value: "v2"
            - name: FAIL_RATE
              value: "0"
            - name: APP_ENV
              value: "demo"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      # Rollouts owns the selectors of these two services and the weight
      # annotations of the canary ingress it derives from stableIngress.
      stableService: orders-api-stable
      canaryService: orders-api-canary
      trafficRouting:
        nginx:
          stableIngress: orders-api
      maxSurge: 1
      maxUnavailable: 0
      # Real traffic weights (not just pod ratios): 20% -> 50% -> 100%.
      # Pauses are long enough for the analysis (45s warm-up + 20s interval) to
      # take at least two measurements at every weight.
      steps:
        - setWeight: 20
        - pause: { duration: 90s }
        - setWeight: 50
        - pause: { duration: 90s }
        - setWeight: 100
      analysis:
        templates:
          - templateName: success-rate
        # 0-based: start analysing at the first pause, i.e. right after the
        # canary is serving 20% of the traffic.
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
